<!DOCTYPE html>
<html>
<head>
    <title>Flow Test</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .page { display: none; padding: 20px; border: 2px solid #ccc; margin: 10px 0; }
        .page.active { display: block; background: #f0f0f0; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Flow Test</h1>
    <div id="claimPage" class="page active">
        <h2>Page 1: Claim</h2>
        <button id="claimBtn">Claim Gift</button>
    </div>
    <div id="proposalPage" class="page">
        <h2>Page 2: Proposal</h2>
        <button id="yesBtnInitial">Yes</button>
        <button id="noBtn">No</button>
    </div>
    <div id="dateLocationPage" class="page">
        <h2>Page 3: Location</h2>
        <button class="location-btn" data-location="Coffee">Coffee</button>
    </div>
    <div id="celebrationPage" class="page">
        <h2>Page 4: Celebration</h2>
        <div id="locationDisplay"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
